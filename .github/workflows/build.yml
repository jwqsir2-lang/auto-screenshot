name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.2

      - name: Ensure release keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -alias autoscreenshot \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass autoscreenshot -keypass autoscreenshot \
              -dname "CN=AutoScreenshot, OU=App, O=jwqsir2-lang, L=NA, S=NA, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/release.jks
            git commit -m "chore: add release signing keystore"
            git push
            echo "keystore created and committed"
          else
            echo "keystore already present"
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Verify APK signature, permissions and components
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          echo "== signature =="
          "$APKSIGNER" verify --verbose "$APK"
          echo "== permissions =="
          "$AAPT2" dump permissions "$APK"
          for p in android.permission.FOREGROUND_SERVICE \
                   android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION \
                   android.permission.POST_NOTIFICATIONS \
                   android.permission.RECEIVE_BOOT_COMPLETED; do
            "$AAPT2" dump permissions "$APK" \
              | grep -q "$p" || { echo "MISSING PERMISSION: $p"; exit 1; }
          done
          echo "== components in merged manifest =="
          MANIFEST=$(find app/build/intermediates/merged_manifests -name AndroidManifest.xml | head -1)
          test -n "$MANIFEST" || { echo "merged manifest not found"; exit 1; }
          grep -E "ScreenshotService|BootReceiver|MyDeviceAdminReceiver" "$MANIFEST"
          grep -q 'foregroundServiceType="mediaProjection"' "$MANIFEST" \
            || { echo "MISSING foregroundServiceType"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: autoscreenshot-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
